<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <p>Let the Magic Begin!</p>
    </header>
    <main>
        <h1>Welcome To My Book Store, Muggles</h1>
        <div class="content" id="content">
            <div class="bookContent" id="bookContent">
                <h2>Harry Potter und der Stein der Weisen</h2>
                <img class="bookImg" src="img/harry-potter-6261488_1280.jpg" alt="">
                <div class="priceAndLike">
                    <h3 class="price">Preis: 100€</h3>
                    <p class="likes">150 <img class="heartImg" src="img/heart-empty.png" alt=""></p>
                </div>
                <div class="bookData">
                    <div class="dataValue">
                        <p>Author:</p>
                        <p>Published:</p>
                        <p>Genre:</p>
                    </div>
                    <div class="bookKeys">
                        <p>JK- Rowling</p>
                        <p>2018</p>
                        <p>Fantasy</p>
                    </div>
                </div>
                <div>
                    
                </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>
</body>
